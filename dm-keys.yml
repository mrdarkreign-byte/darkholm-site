
# /keys: shows each player's crate key balances. List order = display order (id: name).
# Physical key items in a player's inventory or ender chest are removed and added to their balance
# (convert: physical key id -> virtual key id). After editing: /darkholmmenus
keys:
  header: '&6&lYour Crate Keys'
  line: '&8» %name%&7: %color%%amount%'
  footer: '&7Open crates in the Great Hall at Darkholm castle.'
  converted: '&7Your %name% &7x%amount% was added to your key balance. Check it with &e/keys&7.'
  list:
    votev: '&#55FFFFVote Key'
    bronze: '&#CD7F32Bronze Key'
    silver: '&#C0C0C0Silver Key'
    gold: '&#FFD700Gold Key'
    emerald: '&#50C878Emerald Key'
    enchanter: '&#B57BFFEnchanter Key'
    spawner: '&#FF5555Spawner Key'
  convert-enabled: true
  convert:
    vote: votev
    bronze: bronze
    silver: silver
    gold: gold
    emerald: emerald
    enchanter: enchanter
    spawner: spawner
